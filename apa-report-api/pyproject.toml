[project]
name = "apa-report-api"
version = "1.0.0"
description = "FastAPI backend and workers for the APA Report Generator"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "aioboto3>=13.0",
    "redis>=5.0",
    "httpx>=0.27",
    "tenacity>=8.3",
    "anthropic>=0.40",
    "pyjwt[crypto]>=2.8",
    "citeproc-py>=0.6",
    "citeproc-py-styles>=0.1.3",
    "python-docx>=1.1",
    "weasyprint>=62",
    "markdown>=3.6",
    "structlog>=24.1",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "moto[server,sqs,s3]>=5.0",
    "fakeredis>=2.23",
    "asgi-lifespan>=2.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
